<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="collage-bg">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>
  </div>

  <div class="card-wrapper">
    <img src="Images/FlowersLeft.png" alt="" class="corner-img top-left">
    <img src="Images/FlowersRight.png" alt="" class="corner-img bottom-right">

    <div class="envelope-card" id="envelopeCard">
      <div class="card-bg-image"></div>

      <p class="eyebrow-mono">Contenido privado</p>
      <h1 class="letter-title">Para Natalia</h1>
      <p class="letter-hint">Solo se puede acceder con la fecha que ambos sabemos</p>

      <form id="lockForm" autocomplete="off">
        <div class="date-fields">
          <input type="text" id="dayInput" placeholder="Día" maxlength="2" inputmode="numeric" aria-label="Día">
          <span class="date-separator">/</span>
          <input type="text" id="monthInput" placeholder="Mes" maxlength="2" inputmode="numeric" aria-label="Mes">
        </div>
        <button type="submit" class="btn-primary">Abrir</button>
      </form>

      <p class="error-msg" id="errorMsg">Esa fecha no es... prueba otra vez.</p>
    </div>
  </div>

  <script>
    (function(){
      var dayInput = document.getElementById('dayInput');
      var monthInput = document.getElementById('monthInput');
      var form = document.getElementById('lockForm');
      var errorMsg = document.getElementById('errorMsg');
      var envelopeCard = document.getElementById('envelopeCard');

      function isCorrectDate(day, month){
        return (parseInt(day,10) === 18 && parseInt(month,10) === 8);
      }

      form.addEventListener('submit', function(e){
        e.preventDefault();
        var day = dayInput.value.trim();
        var month = monthInput.value.trim();
        if(day && month && isCorrectDate(day, month)){
          unlock();
        } else {
          errorMsg.classList.add('show');
          envelopeCard.classList.remove('shake');
          void envelopeCard.offsetWidth;
          envelopeCard.classList.add('shake');
          dayInput.value = '';
          monthInput.value = '';
          dayInput.focus();
        }
      });

      function unlock(){
        burstHearts();
        setTimeout(function(){
          window.location.href = 'pagina2.html';
        }, 900);
      }

      function burstHearts(){
        var wrap = document.createElement('div');
        wrap.className = 'heart-burst';
        document.body.appendChild(wrap);
        for(var i=0;i<20;i++){
          var s = document.createElement('span');
          s.textContent = '♥';
          s.style.left = (Math.random()*100)+'vw';
          s.style.animationDelay = (Math.random()*0.5)+'s';
          s.style.fontSize = (12+Math.random()*20)+'px';
          s.style.color = ['#ff6b9d','#ff9a56','#ffd166','#6bc1ff'][Math.floor(Math.random()*4)];
          wrap.appendChild(s);
        }
      }
    })();
  </script>
</body>
</html>
